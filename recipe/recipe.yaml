context:
  name: refscrub
  version: "1.1.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://gitlab.com/earthscope/public/epic/passoft/refscrub/-/archive/v${{ version }}/refscrub-v${{ version }}.tar.gz
  sha256: 3c5048ba1345e8388b65c46131b2ff9599acebccede7d023db68afd357b0d732

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  python:
    entry_points:
      - refscrub = refscrub.refscrub:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - refscrub
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - refscrub -h
  - script:
      - python -m unittest discover -s tests
    requirements:
      run:
        - python ${{ python_min }}.*
    files:
      source:
        - tests/

about:
  homepage: https://epic.earthscope.org/content/software-resources
  summary: Remove select packets from RT130 data
  description: |
    Refscrub can read REFTEK files or CF card disk images, report
    packet issues, and write good packets by serial number to
    scrubbed output files.
  license: GPL-3.0-or-later
  license_file: LICENSE
  repository: https://gitlab.com/earthscope/public/epic/passoft/refscrub

extra:
  recipe-maintainers:
    - omid-earthscope
    - destinykuehn-earthscope
